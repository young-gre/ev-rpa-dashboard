<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EV RPA 실행 로그 대시보드</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #222; }
    header { background: #1F4E79; color: #fff; padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 20px; font-weight: 600; }
    .container { max-width: 1200px; margin: 24px auto; padding: 0 20px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .stat-card .label { font-size: 12px; color: #888; margin-bottom: 8px; }
    .stat-card .value { font-size: 28px; font-weight: 700; color: #1F4E79; }
    .toolbar { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
    .toolbar select, .toolbar input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; background: #fff; }
    .btn { padding: 8px 18px; background: #1F4E79; color: #fff; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .btn:hover { background: #163a5f; }
    .table-wrap { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th { background: #1F4E79; color: #fff; padding: 12px 14px; text-align: left; font-weight: 500; }
    tbody tr:nth-child(even) { background: #f8f9fc; }
    tbody tr:hover { background: #eef2f8; cursor: pointer; }
    tbody td { padding: 11px 14px; border-bottom: 1px solid #f0f0f0; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
    .badge.START    { background: #e3f2fd; color: #1565c0; }
    .badge.ROW_DONE { background: #e8f5e9; color: #2e7d32; }
    .badge.FINISH   { background: #f3e5f5; color: #6a1b9a; }
    .badge.FULL_LOG { background: #fff8e1; color: #f57f17; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal { background: #1E2A3A; color: #A8D8A8; border-radius: 10px; width: 90%; max-width: 900px; max-height: 80vh; display: flex; flex-direction: column; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #2a3a4a; }
    .modal-header h3 { color: #fff; font-size: 15px; }
    .modal-close { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; }
    .modal-close:hover { color: #fff; }
    .modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
    .modal-body pre { font-family: 'Consolas', monospace; font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
    .empty { text-align: center; padding: 60px; color: #aaa; }
    .loading { text-align: center; padding: 60px; color: #888; }
  </style>
</head>
<body>
<header>
  <h1>⚡ EV RPA 실행 로그 대시보드</h1>
  <span id="last-refresh" style="font-size:13px;opacity:.8">-</span>
</header>
<div class="container">
  <div class="stats">
    <div class="stat-card"><div class="label">총 실행 시작</div><div class="value" id="cnt-start">-</div></div>
    <div class="stat-card"><div class="label">총 처리 건수</div><div class="value" id="cnt-done">-</div></div>
    <div class="stat-card"><div class="label">완료 세션</div><div class="value" id="cnt-finish">-</div></div>
    <div class="stat-card"><div class="label">전체 로그</div><div class="value" id="cnt-fulllog">-</div></div>
  </div>
  <div class="toolbar">
    <select id="filter-event">
      <option value="">전체 이벤트</option>
      <option value="START">START</option>
      <option value="ROW_DONE">ROW_DONE</option>
      <option value="FINISH">FINISH</option>
      <option value="FULL_LOG">FULL_LOG</option>
    </select>
    <select id="filter-version">
      <option value="">전체 버전</option>
      <option value="v5.0">v5.0</option>
      <option value="v4.3">v4.3</option>
      <option value="truck_v1.0">truck_v1.0</option>
    </select>
    <input type="text" id="filter-host" placeholder="호스트명 검색...">
    <button class="btn" onclick="loadLogs()">🔄 새로고침</button>
  </div>
  <div class="table-wrap">
    <div class="loading" id="loading">로딩 중...</div>
    <table id="log-table" style="display:none">
      <thead>
        <tr><th>시간</th><th>이벤트</th><th>버전</th><th>호스트명</th><th>PC ID</th><th>상세</th></tr>
      </thead>
      <tbody id="log-body"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">로그가 없습니다.</div>
  </div>
</div>
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">전체 로그</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body"><pre id="modal-content"></pre></div>
  </div>
</div>
<script>
  let allLogs = [];
  function formatTime(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  function renderLogs(logs) {
    const tbody = document.getElementById('log-body');
    const table = document.getElementById('log-table');
    const empty = document.getElementById('empty');
    document.getElementById('loading').style.display = 'none';
    if (!logs || logs.length === 0) { table.style.display='none'; empty.style.display='block'; return; }
    table.style.display = 'table'; empty.style.display = 'none';
    tbody.innerHTML = logs.map(log => `
      <tr onclick='onRowClick(${JSON.stringify(log)})'>
        <td>${formatTime(log.timestamp)}</td>
        <td><span class="badge ${log.event}">${log.event||'-'}</span></td>
        <td>${log.version||'-'}</td>
        <td>${log.hostname||'-'}</td>
        <td style="font-family:monospace;font-size:11px">${log.machine_id||'-'}</td>
        <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${
          log.event === 'FULL_LOG' ? '📄 클릭하여 전체 로그 보기' : (log.detail||'-')
        }</td>
      </tr>`).join('');
  }
  function onRowClick(log) {
    if (log.event === 'FULL_LOG') {
      document.getElementById('modal-title').textContent = `전체 로그 — ${formatTime(log.timestamp)} (${log.hostname})`;
      document.getElementById('modal-content').textContent = log.detail;
      document.getElementById('modal').classList.add('active');
    }
  }
  function closeModal() { document.getElementById('modal').classList.remove('active'); }
  document.getElementById('modal').addEventListener('click', function(e) { if(e.target===this) closeModal(); });
  function applyFilters() {
    const event   = document.getElementById('filter-event').value;
    const version = document.getElementById('filter-version').value;
    const host    = document.getElementById('filter-host').value.toLowerCase();
    renderLogs(allLogs.filter(log => {
      if (event   && log.event   !== event)   return false;
      if (version && log.version !== version) return false;
      if (host    && !(log.hostname||'').toLowerCase().includes(host)) return false;
      return true;
    }));
  }
  function updateStats(logs) {
    document.getElementById('cnt-start').textContent   = logs.filter(l=>l.event==='START').length;
    document.getElementById('cnt-done').textContent    = logs.filter(l=>l.event==='ROW_DONE').length;
    document.getElementById('cnt-finish').textContent  = logs.filter(l=>l.event==='FINISH').length;
    document.getElementById('cnt-fulllog').textContent = logs.filter(l=>l.event==='FULL_LOG').length;
  }
  async function loadLogs() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('log-table').style.display = 'none';
    try {
      const res = await fetch('/api/logs');
      const data = await res.json();
      allLogs = data.logs || [];
      updateStats(allLogs);
      applyFilters();
      document.getElementById('last-refresh').textContent = `마지막 갱신: ${new Date().toLocaleTimeString('ko-KR')}`;
    } catch(e) {
      document.getElementById('loading').textContent = '로드 실패';
    }
  }
  document.getElementById('filter-event').addEventListener('change', applyFilters);
  document.getElementById('filter-version').addEventListener('change', applyFilters);
  document.getElementById('filter-host').addEventListener('input', applyFilters);
  loadLogs();
  setInterval(loadLogs, 60000);
</script>
</body>
</html>
